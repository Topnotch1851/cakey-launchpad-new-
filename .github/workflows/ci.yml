name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs for the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Public-safe defaults so `next build` doesn't fail on missing env vars.
    # Real production values are set per-environment on Vercel; this build is
    # only validating that the code compiles, not that it can talk to Supabase.
    env:
      NEXT_PUBLIC_SITE_URL: https://cakey.ai
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      # Used by the server action's salt validator.  16+ chars satisfies the prod check.
      WAITLIST_IP_SALT: ci-placeholder-salt-not-a-real-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
